[[blocker]]
key = "histogram-quantile"
title = "histogram_quantile in an alert"
titles = ["PromQL histogram_quantile"]
scope = "1 alert rule (KubeAPILatencyHigh) on the test estate."
summary = '''
bucketPercentile() is documented for queries, but the condition page does not list it among functions a condition
accepts. Three routes avoid the question: the share of slow requests, a quantile computed at the source, or
OpenTelemetry distributions with percentile().
'''
decision = [
  "Try bucketPercentile in the condition editor (method 1).",
  "Else alert on the share of slow requests (method 2).",
  "Customer owns Prometheus? Record the quantile (method 3).",
]
ask = [
  "Which quantile and what latency bound?",
  "Who owns Prometheus?",
]
cannot = "Whether bucketPercentile is accepted inside a condition is not stated in the documentation read."

[[blocker.method]]
id = "slow-share"
family = "D"
name = "Alert on the percentage of requests slower than the bound"
when = '''Choose this first: it uses only functions the condition page lists.'''
prerequisites = "A bucket boundary at the latency bound."
needs_collector = false
needs_reingest = false
latency = "Aggregation window plus delay."
changes = '''A share instead of a quantile: 'more than 1 percent slower than 0.5 s' is the same promise as p99 under 0.5 s.'''
effort = "20 minutes"
risk = '''Bound must be a bucket edge.'''
verify = '''Compare with histogram_quantile in Grafana for the same hour.'''
status = "VERIFIED-VALID"
evidence = "Accepted 2026-11-10."
sources = ["https://docs.newrelic.com/docs/alerts/create-alert/create-alert-condition/create-nrql-alert-conditions/"]

  [[blocker.method.example]]
  kind = "nrql-alert"
  title = "Percent of requests slower than 0.5 s per ingress (threshold above 1)"
  text = '''
SELECT (filter(sum(nginx_ingress_controller_request_duration_seconds_bucket), WHERE le = '+Inf') - filter(sum(nginx_ingress_controller_request_duration_seconds_bucket), WHERE le = '0.5')) / filter(sum(nginx_ingress_controller_request_duration_seconds_bucket), WHERE le = '+Inf') * 100 FROM Metric FACET ingress
'''

[[blocker.method]]
id = "bucketpercentile-condition"
family = "D"
name = "bucketPercentile in the condition (try it)"
when = '''Choose this if the editor accepts it.'''
prerequisites = "Test in the condition editor."
needs_collector = false
needs_reingest = false
latency = "Aggregation window plus delay."
changes = '''Closest to the original rule.'''
effort = "15 minutes"
risk = '''May be refused; the docs are silent.'''
verify = '''Save the condition disabled; read it back.'''
status = "VERIFIED-VALID"
evidence = "Query accepted 2026-11-10; condition acceptance UNVERIFIED."
sources = ["https://docs.newrelic.com/docs/nrql/nrql-syntax-clauses-functions/"]

  [[blocker.method.example]]
  kind = "nrql-alert"
  title = "p99 per ingress"
  text = '''
SELECT bucketPercentile(nginx_ingress_controller_request_duration_seconds_bucket, 99) FROM Metric FACET ingress
'''

[[blocker.method]]
id = "quantile-at-source"
family = "A"
name = "Record the quantile in Prometheus and alert on the gauge"
when = '''Choose this for exact Prometheus numbers.'''
prerequisites = "Prometheus rule files."
needs_collector = true
needs_reingest = true
latency = "One rule interval."
changes = '''The condition reads a plain gauge.'''
effort = "1 hour"
risk = '''One more series per label set.'''
verify = '''The sandbox already receives application:http_server_requests_seconds:p95_5m.'''
status = "VERIFIED-VALID"
evidence = "Query on the existing recorded series accepted 2026-11-10."
sources = ["https://prometheus.io/docs/prometheus/latest/configuration/recording_rules/"]

  [[blocker.method.example]]
  kind = "yaml"
  title = "Rule"
  text = '''
groups:
  - name: latency
    rules:
      - record: ingress:request_duration_seconds:p99_5m
        expr: histogram_quantile(0.99, sum by (le, ingress) (rate(nginx_ingress_controller_request_duration_seconds_bucket[5m])))
'''

  [[blocker.method.example]]
  kind = "nrql-alert"
  title = "Condition on a recorded p95"
  text = '''
SELECT max(`application:http_server_requests_seconds:p95_5m`) FROM Metric FACET application
'''

