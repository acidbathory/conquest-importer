  [[blocker.method.example]]
  kind = "yaml"
  title = "Replace colons with underscores"
  text = '''
write_relabel_configs:
  - source_labels: [__name__]
    regex: "([^:]+):([^:]+):([^:]+)"
    target_label: __name__
    replacement: "${1}_${2}_${3}"
'''
