# Alert behaviour (for / pending, no data) and notification routing.

[[blocker]]
key = "pending-nodata"
title = "for / pending duration, noDataState and execErrState"
titles = ["Grafana pending period too long", "Grafana no-data and error states", "Grafana keep firing or recovery threshold", "Grafana window too long"]
scope = "Every alert rule has a for duration and a no-data state; 53 of 55 rules use NoData/Error defaults (2026-11-10 test estate)."
summary = '''
Grafana's `for` is a pending period. New Relic's threshold duration ("for at least N minutes" or "at least once in N
minutes") sits on top of an aggregation window. No-data handling maps to loss of signal and gap filling. Query
errors have no New Relic counterpart.
'''
decision = [
  "Map `for` to threshold duration and occurrences (method 1).",
  "Map NoData to loss of signal or gap filling (method 2).",
  "Sparse data? Pick the streaming method (method 3).",
  "KeepFiring and recovery thresholds are not available (method 4).",
]
ask = [
  "What should happen when data stops: alert, stay quiet or keep the last state?",
  "How often does the data arrive?",
]
cannot = "No keep_firing_for, no recovery threshold, no execErrState: a failing query is not alertable."

[[blocker.method]]
id = "for-to-duration"
family = "D"
name = "Map for to threshold duration and occurrences"
when = '''Choose this for every rule.'''
prerequisites = "Duration is a multiple of the aggregation window (60 to 86400 s)."
needs_collector = false
needs_reingest = false
latency = "Duration plus window plus delay; the live test measured about 5 minutes more than Grafana."
changes = '''"for 5m" becomes threshold_duration 300 with occurrences ALL. "At least once in" is AT_LEAST_ONCE. Any edit resets evaluation.'''
effort = "10 minutes"
risk = '''A duration over 24 hours is refused.'''
verify = '''Firing test on a throwaway policy.'''
status = "DOC-ONLY"
evidence = "Terms read in the NRQL condition page and provider schema. Not created."
sources = ["https://docs.newrelic.com/docs/alerts/create-alert/create-alert-condition/create-nrql-alert-conditions/"]

  [[blocker.method.example]]
  kind = "hcl"
  title = "for: 5m"
  text = '''
critical {
  operator              = "above"
  threshold             = 0
  threshold_duration    = 300
  threshold_occurrences = "all"
}
'''

[[blocker.method]]
id = "nodata-mapping"
family = "D"
name = "Map NoData to loss of signal and gap filling"
when = '''Choose this to reproduce NoData=Alerting or OK.'''
prerequisites = "A first data point."
needs_collector = false
needs_reingest = false
latency = "Expiration duration."
changes = '''NoData=Alerting: open_violation_on_expiration. NoData=OK: close_violations_on_expiration. KeepLast: fill_option last_value.'''
effort = "15 minutes"
risk = '''Gap filling happens only after a later point arrives.'''
verify = '''Stop a test sender.'''
status = "VERIFIED-VALID"
evidence = "Query accepted 2026-11-10; settings from the loss-of-signal page."
sources = ["https://docs.newrelic.com/docs/apis/nerdgraph/examples/nerdgraph-api-loss-signal-gap-filling/"]

  [[blocker.method.example]]
  kind = "nrql-alert"
  title = "Query that keeps NULL for empty windows"
  text = '''
SELECT count(*) FROM Metric WHERE metricName = 'ckg_flaky_heartbeat'
'''

  [[blocker.method.example]]
  kind = "hcl"
  title = "NoData=Alerting"
  text = '''
expiration_duration          = 300
open_violation_on_expiration = true
fill_option                  = "none"
'''

[[blocker.method]]
id = "streaming-method"
family = "D"
name = "Choose event_flow, event_timer or cadence"
when = '''Choose event_timer for sparse data.'''
prerequisites = "Know the arrival pattern."
needs_collector = false
needs_reingest = false
latency = "Delay default 120 s; timer default 60 s."
changes = '''Changes when windows close.'''
effort = "10 minutes"
risk = '''Wrong method delays or drops evaluation.'''
verify = '''Compare time to fire.'''
status = "DOC-ONLY"
evidence = "Read in the streaming concepts page."
sources = ["https://docs.newrelic.com/docs/alerts/create-alert/create-alert-condition/create-nrql-alert-conditions/"]

  [[blocker.method.example]]
  kind = "hcl"
  title = "Sparse data"
  text = '''
aggregation_method = "event_timer"
aggregation_timer  = 120
'''

[[blocker.method]]
id = "no-hysteresis"
family = "F"
name = "Accept: no keep-firing or recovery threshold"
when = '''Choose this and use longer durations.'''
prerequisites = "Owner agrees."
needs_collector = false
needs_reingest = false
latency = "None."
changes = '''Flapping is damped only by duration.'''
