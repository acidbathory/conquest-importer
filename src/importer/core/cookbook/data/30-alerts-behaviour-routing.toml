  text = '''
resource "newrelic_nrql_alert_condition" "per_namespace" {
  for_each  = toset(["payments", "web"])
  policy_id = newrelic_alert_policy.by_ns[each.key].id
  # name, nrql and critical blocks use each.key
}
'''

