'''

[[blocker]]
key = "routing"
title = "Label-based notification routing"
titles = [
  "Grafana notification policy matcher undecidable",
  "Grafana notification policy regular expression",
  "Grafana notification policy order",
  "Grafana notification policy matcher not understood",
  "Grafana notification policy rule without receiver",
  "Grafana notification policy grouping or timing",
  "Grafana route without a destination New Relic can create",
]
scope = "Routes with regex matchers or ordering on the test estate."
summary = '''
Grafana routes by alert labels in a policy tree. New Relic workflows filter issues by attributes such as
accumulations.tag.team, policy ids or condition names.
'''
decision = [
  "Tag conditions and filter on the tag (method 1).",
  "One policy per route (method 2).",
  "Route by a metric label value: one condition per value (method 3).",
  "Accept ordering differences (method 4).",
]
ask = [
  "Which labels route and how many routes?",
  "Is the value a metric label or a rule label?",
]
cannot = "Workflows cannot route on a facet value; no continue/ordering semantics."

[[blocker.method]]
id = "tag-filter"
family = "D"
name = "Workflow filter on accumulations.tag.<key>"
when = '''Choose this for team-style labels.'''
prerequisites = "Entity tags on the condition or entity; channel ids."
needs_collector = false
needs_reingest = false
latency = "None."
changes = '''Tags appear on the issue only after one has carried them.'''
effort = "30 minutes"
risk = '''Tag spelling differs between pages.'''
verify = '''Use the workflow test.'''
status = "DOC-ONLY"
evidence = "Example read in the NerdGraph workflows page. Not run."
sources = ["https://docs.newrelic.com/docs/apis/nerdgraph/examples/nerdgraph-api-workflows/"]

  [[blocker.method.example]]
  kind = "graphql"
  title = "Workflow for team payments"
  text = '''
mutation {
  aiWorkflowsCreateWorkflow(accountId: 1234567, createWorkflowData: {
    name: "route team payments"
    workflowEnabled: false
    destinationsEnabled: true
    mutingRulesHandling: DONT_NOTIFY_FULLY_MUTED_ISSUES
    issuesFilter: { name: "team", type: FILTER,
      predicates: [{ attribute: "accumulations.tag.team", operator: EXACTLY_MATCHES, values: ["payments"] }] }
    destinationConfigurations: { channelId: "CHANNEL_ID", notificationTriggers: [ACTIVATED, CLOSED] }
  }) { workflow { id } errors { description type } }
}
'''

