[[blocker]]
key = "mute-timings"
title = "Mute timings with active intervals"
titles = [
  "Grafana mute timing days of the month",
  "Grafana mute timing months or years",
  "Grafana mute timing location",
  "Grafana mute timing time range",
  "Grafana mute timing weekdays",
  "Grafana active time interval",
  "Grafana mute timing with too many schedules",
  "Grafana mute timing with combined fields",
]
scope = "2 of 3 mute timings did not convert on the test estate."
summary = '''
A muting rule has one window with a daily, weekly or monthly repeat. Grafana intervals combine weekdays, days of the
month, months and times.
'''
decision = [
  "Weekly pattern: one weekly rule (method 1).",
  "Months or days: several rules (method 2).",
  "Scope to a team (method 3).",
  "Make workflows respect muting (method 4).",
]
ask = [
  "Which alerts must be muted and when?",
  "Time zone?",
]
cannot = "No months-of-year or days-of-month lists in one rule."

[[blocker.method]]
id = "weekly-rule"
family = "D"
name = "One weekly muting rule"
when = '''Choose this for weekday windows.'''
prerequisites = "Time zone."
needs_collector = false
needs_reingest = false
latency = "None."
changes = '''Window may cross midnight.'''
effort = "20 minutes"
risk = '''DST.'''
verify = '''Read back.'''
status = "DOC-ONLY"
evidence = "Fields read in the muting rules page."
sources = ["https://docs.newrelic.com/docs/alerts/get-notified/muting-rules-suppress-notifications/"]

  [[blocker.method.example]]
  kind = "graphql"
  title = "Weeknights 22:00 to 06:00"
  text = '''
mutation {
  alertsMutingRuleCreate(accountId: 1234567, rule: {
    name: "weeknights", enabled: true,
    description: "migrated mute timing",
    schedule: { startTime: "2026-11-16T22:00:00", endTime: "2026-11-17T06:00:00",
      timeZone: "Europe/Amsterdam", repeat: WEEKLY,
      weeklyRepeatDays: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY] }
    condition: { operator: AND, conditions: [{ attribute: "policyId", operator: EQUALS, values: ["POLICY_ID"] }] }
  }) { id }
}
'''

[[blocker.method]]
id = "unroll-rules"
family = "D"
name = "Unroll months and days into several rules"
when = '''Choose this for monthly or seasonal windows.'''
