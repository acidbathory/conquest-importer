status = "DOC-ONLY"
evidence = "Schedule fields read."
sources = ["https://registry.terraform.io/providers/newrelic/newrelic/latest/docs/resources/alert_muting_rule"]

  [[blocker.method.example]]
  kind = "hcl"
  title = "One rule per date"
  text = '''
resource "newrelic_alert_muting_rule" "window" {
  for_each = toset(["2026-12-24", "2026-12-31"])
  name     = "mute ${each.key}"
  enabled  = true
  schedule {
    start_time = "${each.key}T00:00:00"
    end_time   = "${each.key}T23:59:59"
    time_zone  = "Europe/Amsterdam"
  }
}
'''

