repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy src tests
        language: system
        pass_filenames: false
        types: [python]
      - id: vulture
        name: vulture (dead code)
        entry: uv run vulture src --min-confidence 80
        language: system
        pass_filenames: false
        types: [python]
      - id: terraform-fmt
        name: terraform fmt
        entry: terraform fmt -check
        language: system
        files: \.tf$
      - id: yamllint
        name: yamllint
        entry: uv run yamllint -d relaxed
        language: system
        types: [yaml]
      - id: actionlint
        name: actionlint
        entry: uv run actionlint
        language: system
        files: ^\.github/workflows/
        pass_filenames: false
