[project]
name = "conquest-importer"
version = "0.1.0"
description = "Prototype: migrate alerts, notifications and dashboards from Grafana, Dynatrace, AWS CloudWatch and Google Cloud Monitoring to New Relic"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "typer>=0.12,<1",
    "truststore>=0.10.4",
    "boto3>=1.43.123",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
    "yamllint>=1.38.0",
    "actionlint-py>=1.7.12.25",
    "vulture>=2.16",
]

[project.scripts]
importer = "importer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/importer"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "B", "S", "UP", "SIM",
    "C4", "PIE", "PERF", "RET", "RUF", "PT", "DTZ", "T20", "ARG", "C90",
]
# PT018: splitting `assert a and b` is style noise in table-style tests.
ignore = ["PT018"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ARG001", "ARG002"]
# CLI helper scripts report to the terminal.
"scripts/**" = ["T201"]
# Read-only verifier: NRQL text is fixed cookbook content, value checks are long one-line queries.
"scripts/improve/verify_cookbook.py" = ["E501", "S608", "S101", "DTZ011"]
# Throwaway analysis and live-test scripts: wide data tables and plain urllib calls to fixed
# https hosts. They are not shipped code and are not imported by the package.
"scripts/analysis/**" = ["E501", "PERF401", "C901", "C416", "RUF007"]
"scripts/live-test/grafana-sandbox/**" = [
  "E501", "S310", "SIM115", "ARG001", "ARG005", "PERF401", "C901", "C416", "RUF007",
]
# Rig scripts: synthetic data generators and a read-only comparison harness (not shipped code).
"scripts/live-test/telemetry-rig/**" = [
  "E501", "S310", "S311", "S603", "S607", "ARG001", "B007", "PERF401", "C901", "RUF100",
]
# Azure test-estate scripts: long JSON-shaped literals and URLs.
"scripts/live-test/azure-estate/**" = ["E501"]
# Lambda handler signature is fixed by AWS.
"scripts/live-test/aws/handler.py" = ["ARG001"]
# Terraform template text contains long lines that cannot be wrapped.
"src/importer/sources/cloudwatch/ingest.py" = ["E501"]
"src/importer/sources/cloudwatch/log_ingest.py" = ["E501"]

[tool.mypy]
strict = true
# Runs inside AWS Lambda, where boto3 is provided; not part of the package.
exclude = ["scripts/live-test/aws/handler.py"]
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# An unclosed file, socket or client is a leak: fail the test that caused it.
filterwarnings = ["error::ResourceWarning", "error::pytest.PytestUnraisableExceptionWarning"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true
