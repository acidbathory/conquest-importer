[project]
name = "conquest-importer"
version = "0.1.0"
description = "Prototype: convert Datadog monitors to New Relic alert conditions"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "typer>=0.12,<1",
    "truststore>=0.10.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
]

[project.scripts]
importer = "importer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/importer"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Terraform template text contains long lines that cannot be wrapped.
"src/importer/emit/ingest.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
