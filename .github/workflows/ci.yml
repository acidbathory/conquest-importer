name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pytest
      - run: uv run pip-audit
      - name: Plain pip install works (what users do)
        run: |
          python3 -m venv /tmp/user-venv
          /tmp/user-venv/bin/pip install .
          /tmp/user-venv/bin/importer --help
      - run: uv run vulture src --min-confidence 80
      - run: uv run yamllint -d relaxed .github .pre-commit-config.yaml
      - run: uv run actionlint
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive scripts
      - uses: terraform-linters/setup-tflint@v4
      - run: |
          for d in scripts/live-test/aws scripts/live-test/services; do
            tflint --chdir "$d"
          done
