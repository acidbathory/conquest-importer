name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run mypy src tests
      - run: uv run pytest

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pytest
      - run: uv run pip-audit
      - name: Plain pip install works (what users do)
        run: |
          python3 -m venv /tmp/user-venv
          /tmp/user-venv/bin/pip install .
          /tmp/user-venv/bin/importer --help
      - run: uv run vulture src --min-confidence 80
      - run: uv run yamllint -d relaxed .github .pre-commit-config.yaml
      - run: uv run actionlint
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive scripts
      - uses: terraform-linters/setup-tflint@v4
      - run: |
          for d in scripts/live-test/aws scripts/live-test/services scripts/live-test/metric-naming scripts/live-test/gcp-link scripts/live-test/gcp-sample; do
            tflint --chdir "$d"
          done

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's checksums file
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned release, checksum verified)
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum --check -
          mkdir /tmp/gitleaks-bin
          tar -xzf /tmp/gitleaks.tgz -C /tmp/gitleaks-bin gitleaks
      - name: Scan the full git history (values are redacted in the log)
        run: /tmp/gitleaks-bin/gitleaks git -c gitleaks.toml --redact --no-banner .

  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --locked
      - name: Licence gate, fixture licences and clean-room scan
        run: uv run python scripts/improve/license_check.py
      - name: CycloneDX SBOM of the runtime dependencies
        run: |
          uv export --locked --no-dev --no-hashes --no-emit-project -o runtime-requirements.txt
          uv run cyclonedx-py requirements runtime-requirements.txt \
            --pyproject pyproject.toml --mc-type application --sv 1.6 --of JSON -o sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error
